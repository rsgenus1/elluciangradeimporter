[project]
name = "elluciangradeimporter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José Alejandro Aburto, PhD", email = "rsgenus1.math@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastexcel>=0.21.0",
    "polars>=2.0.0",
    "streamlit>=1.66.0",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
elluciangradeimporter = "elluciangradeimporter:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
